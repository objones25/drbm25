model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306  # Qwen/Qwen2.5-1.5B-Instruct HEAD, looked up 2026-11-20 (last modified 2024-09-25)
  precision: fp16
  train_mode: lora
  gradient_checkpointing: true
lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
ppo:
  batch_size: 64
  mini_batch_size: 16
  micro_batch_size: 4
  ppo_epochs: 1
  clip_ratio: 0.2
  value_clip: 0.5
  entropy_coef: 0.001
  kl_coef: 0.001
  gamma: 1.0
  lam: 1.0
  grad_clip: 1.0
  actor_lr: 2.0e-5
  critic_lr: 1.0e-4
rollout:
  backend: hf
  temperature: 0.6
  top_p: 1.0
  max_prompt_tokens: 256
  max_new_tokens: 350
  generation_batch_size: 32
  vllm_gpu_memory_utilization: 0.2
retrieval:
  index_dir: /expanse/lustre/projects/ACCOUNT/USER/drbm25/indexes
  k1: 0.9
  b: 0.4
  train_k: 10
  eval_k: 10
  search_threads: 8
  search_timeout_s: 10
  expected_docs: 800000
data:
  hf_dataset: DeepRetrieval/datasets
  hf_revision: 44eb79992e8c5ed4784dbe6559f8b097d7d03855
  data_dir: /expanse/lustre/projects/ACCOUNT/USER/drbm25/data
  val_size: 500  # validation queries sampled from train (best-checkpoint selection); test = all 2,305 dev
  split_seed: 1234  # seeds the train/val split only (separate from run.seed)
run:
  output_dir: /expanse/lustre/projects/ACCOUNT/USER/drbm25/runs
  total_steps: 1751
  chunk_steps: 50
  val_every: 50
  ckpt_every: 50
  keep_ckpts: 1  # the one resume checkpoint; the best policy is kept separately in best/
  deep_log_every: 10
  seed: 1234
  wandb_project: drbm25
  wandb_entity: null
  wandb_group: ms-s-bm25
