model:
  name: "tiny-local"
  revision: main
  precision: fp32
  train_mode: lora
  gradient_checkpointing: false
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
ppo:
  batch_size: 4
  mini_batch_size: 2
  micro_batch_size: 1
  ppo_epochs: 1
  clip_ratio: 0.2
  value_clip: 0.5
  entropy_coef: 0.001
  kl_coef: 0.001
  gamma: 1.0
  lam: 1.0
  grad_clip: 1.0
  actor_lr: 2.0e-5
  critic_lr: 1.0e-4
rollout:
  backend: hf
  temperature: 0.6
  top_p: 1.0
  max_prompt_tokens: 256
  max_new_tokens: 16
  generation_batch_size: 4
  vllm_gpu_memory_utilization: 0.2
retrieval:
  index_dir: runs/smoke/indexes
  k1: 0.9
  b: 0.4
  train_k: 10
  eval_k: 10
  search_threads: 8
  search_timeout_s: 10
  expected_docs: 1002
data:
  hf_dataset: DeepRetrieval/datasets
  hf_revision: 44eb79992e8c5ed4784dbe6559f8b097d7d03855
  data_dir: runs/smoke/data
  val_size: 101  # validation queries sampled from train (best-checkpoint selection); test = all of dev
  split_seed: 1234  # seeds the train/val split only (separate from run.seed)
run:
  output_dir: runs/smoke/out
  total_steps: 4
  chunk_steps: 2
  val_every: 2
  ckpt_every: 2
  keep_ckpts: 2
  deep_log_every: 10
  seed: 1234
  dist_timeout_min: 60  # collective timeout: generous, since one rank may save or validate for minutes
  wandb_project: drbm25
  wandb_entity: null
  wandb_group: ms-s-bm25
